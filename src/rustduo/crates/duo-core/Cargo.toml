[package]
name = "duo-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Duo core logic, sunk from Python (TODO 0.2: pure-logic + process layer, pytest contracts mirrored 1:1)"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 宿主窗口（host 子命令）只存在于 Windows；target 门控保证非 Windows
# 编译零影响（TODO 0.3，docs/window-experience.md §14）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "duo-core"
path = "src/main.rs"

[dev-dependencies]
regex = "1"
