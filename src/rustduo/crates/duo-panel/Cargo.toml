[package]
name = "duo-panel"
version = "0.2.1"
edition.workspace = true
license.workspace = true
description = "Duo panel UI in egui (TODO 0.4 v0): settings page, glass window, app grid. Real system-level DWM blur replaces the C# manual-sampling acrylic path."

[dependencies]
duo-core = { path = "../duo-core" }
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
rfd = "0.15"
egui_extras = { version = "0.31", features = ["svg", "file", "image"] }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
raw-window-handle = "0.6"

[[bin]]
name = "duo-panel"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# 真系统级 DWM blur（退役 C# 手采样亚克力）。Linux 侧不拉。
window-vibrancy = "0.5"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(unix)'.dependencies]
# 出图 harness 的 XTEST 指针合成（winit 传递依赖，动态加载不新增 .so）
x11-dl = "2"
