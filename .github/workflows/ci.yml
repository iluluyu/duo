name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Rapid successive pushes only keep the newest run per branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rustduo
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rustduo
      # rfd (duo-panel 设置页文件浏览) 在 Linux 构建期链接 gtk3。
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
