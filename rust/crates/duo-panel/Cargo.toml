[package]
name = "duo-panel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Duo panel UI in egui (TODO 0.4 v0): settings page, glass window, app grid. Real system-level DWM blur replaces the C# manual-sampling acrylic path."

[dependencies]
duo-core = { path = "../duo-core" }
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["svg"] }
encoding_rs = "0.8"
serde_json = "1"

[[bin]]
name = "duo-panel"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
# 真系统级 DWM blur（退役 C# 手采样亚克力）。Linux 侧不拉。
window-vibrancy = "0.5"
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
